<script>
const $=id=>document.getElementById(id);
$('icOk').innerHTML=M.icon('check',30,'#1B252F',3.2);
const CQ=['Agents and buyers may not know the home is for sale.','It won’t appear on public home-search websites.','Agents and buyers may not know the price and terms.','Less exposure can mean fewer offers, a lower price, or a harder sale.'];
const RY=i=>90+i*40;
$('cqs').innerHTML=CQ.map((c,i)=>`<div class="cq" id="q${i}" style="top:${RY(i)}px"><i>(${'abcd'[i]})</i><span>${c}</span><div class="ib"><div class="stamp" id="s${i}">JR</div></div></div>`).join('');
// illustrative: the initials and the typed reason are examples, not a real seller
const STAMP=[1.5,2.2,2.9,3.6], REASON='Privacy while relocating', TY0=4.5, TY1=5.6, SIGN=6.3;
const sp=STAMP.map(x=>M.track(0,[[x,1,[17,0.62]]]));
const signP=M.track(0,[[SIGN-0.07,1,[45,1]],[SIGN+0.035,0,[22,.72]]]);
const IY=i=>-172+RY(i)+19;
M.scene({
  W:860,H:380,bg:null,T:8.8,center:[430,190],intro:0.15,
  SH:{form:{w:820,h:344,r:16,bg:'#FBFAF6',cam:1.0}, done:{w:560,h:196,r:24,bg:'#FBFBFB',cam:1.15}},
  start:'form', SEQ:[[SIGN+0.1,'done']], camSpring:[11,1],
  layers:[
    {el:'Lform',tin:0.15,tout:SIGN+0.1,anchor:'t',o:{din:0.05},update:(t)=>{
      for(let i=0;i<4;i++){const q=$('q'+i),v=M.vis(t,0.45+0.12*i,null,{din:0,lin:0.22}); q.style.opacity=v.o; q.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none';
        const a=sp[i](t), s=$('s'+i); s.style.opacity=t<STAMP[i]?0:1; s.style.transform=`rotate(-5deg) scale(${(1.6-0.6*M.clamp(a)+0.0*a).toFixed(4)})`; s.style.opacity=t<STAMP[i]?0:M.clamp((t-STAMP[i])/0.06);}
      const n=Math.round(M.clamp((t-TY0)/(TY1-TY0))*REASON.length); M.setText($('typed'),REASON.slice(0,n));
      $('caret').style.opacity=(t>TY0-0.3&&t<SIGN)?((t>TY0&&t<TY1)||Math.floor(t*2.4)%2==0?1:0):0;
      $('sign').style.transform=`scale(${1-0.06*signP(t)})`;
    }},
    {el:'Ldone',tin:SIGN+0.1,tout:null,o:{din:0.12,lin:0.28}},
  ],
  cursor:{size:26,clicks:[...STAMP,4.25,SIGN],keys:[[0,220,30],[1.0,220,30],[1.35,343,IY(0)],[1.7,343,IY(0)],[2.05,343,IY(1)],[2.4,343,IY(1)],[2.75,343,IY(2)],[3.1,343,IY(2)],[3.45,343,IY(3)],[3.8,343,IY(3)],[4.15,-40,99],[4.5,-40,99],[5.8,250,128],[6.0,326,145],[6.5,326,145],[7.3,236,112]]},
});
</script>
