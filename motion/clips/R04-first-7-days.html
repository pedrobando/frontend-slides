<title>R04 First 7 days</title>
<style>
.tk{position:absolute;top:8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;box-sizing:border-box}
.dl{position:absolute;top:38px;width:200px;margin-left:-100px;text-align:center;font-family:'Poppins',sans-serif;font-size:24px;font-weight:600;letter-spacing:2.4px;line-height:24px;white-space:nowrap}
.dot{position:absolute;top:-20px;width:12px;height:12px;margin-left:-6px;border-radius:50%}
.dot.b{background:#95A0AE;opacity:.35}
.dot.f{background:#8CC94E}
.ql{position:absolute;top:82px;width:600px;margin-left:-300px;text-align:center;font-family:'Poppins',sans-serif;font-size:24px;font-weight:600;letter-spacing:2.4px;line-height:24px;color:#C05445;white-space:nowrap}
.cl{position:absolute;left:-102px;top:-12px;font-family:'Poppins',sans-serif;font-size:24px;font-weight:600;letter-spacing:2.4px;line-height:24px;color:#95A0AE;white-space:nowrap}
.cn{position:absolute;right:-102px;top:-18px;font-family:'Poppins',sans-serif;font-size:36px;font-weight:700;line-height:36px;color:#FBFBFB;white-space:nowrap;transform-origin:100% 50%}
</style>
<div data-slot="world">
  <div class="a" style="left:-728px;top:11px;width:1456px;height:6px;border-radius:3px;background:rgba(27,37,47,.15)"></div>
  <div class="a" id="fill" style="left:-728px;top:11px;width:0;height:6px;border-radius:3px;background:#8CC94E"></div>
  <div class="a" id="qbar" style="top:-30px;width:4px;height:64px;border-radius:2px;background:#C05445"></div>
  <div id="ticks"></div>
  <div id="dots"></div>
  <div class="ql" id="qlab">MOST AGENTS QUIT HERE</div>
  <div class="a" id="ptr" style="top:-44px;width:16px;height:16px;margin-left:-8px;border-radius:2px;background:#1B252F"></div>
  <div class="a" id="head" style="top:3px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#FBFBFB;border:5px solid #8CC94E;box-sizing:border-box"></div>
</div><!--/world-->
<div data-slot="shape">
  <div class="L" id="Lc"><div class="cl">TOUCHES</div><div class="cn" id="cnt">0</div></div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
// seven days on one track; touches per day from the Seguimiento playbook
const TX=i=>-728+i*1456/6, N=[3,3,3,1,1,1,2], OFF={1:[0],2:[-10,10],3:[-20,0,20]};
const QX=(TX(2)+TX(3))/2;
$('ticks').innerHTML=N.map((n,i)=>`<div class="tk" id="k${i}" style="left:${TX(i)}px"></div><div class="dl" id="d${i}" style="left:${TX(i)}px">DAY ${i+1}</div>`).join('');
const DX=[]; N.forEach((n,i)=>OFF[n].forEach(o=>DX.push([i,TX(i)+o])));
$('dots').innerHTML=DX.map(([i,x],j)=>`<div class="dot b" style="left:${x}px"></div><div class="dot f" id="p${j}" style="left:${x}px"></div>`).join('');
$('qbar').style.left=(QX-2)+'px'; $('qlab').style.left=QX+'px';
// the cursor drags the head day to day, stops at the quit line, then pushes through to day 7
const Y=14, GRAB=1.0, DROP=8.25;
const KX=[[0,-600,96],[0.85,TX(0),Y],[1.65,TX(0),Y],[2.2,TX(1),Y],[2.75,TX(1),Y],[3.3,TX(2),Y],[3.85,TX(2),Y],
  [4.4,-150,Y],[5.05,-150,Y],[5.45,TX(3),Y],[5.75,TX(3),Y],[6.2,TX(4),Y],[6.5,TX(4),Y],[6.95,TX(5),Y],[7.25,TX(5),Y],
  [7.75,TX(6),Y],[DROP,TX(6),Y],[8.9,700,92]];
const cur=M.path(KX);
const hx=t=>t<GRAB?TX(0):t<DROP?cur(t).x:TX(6);
const ARR=[GRAB,...M.crossTimes(hx,GRAB,DROP,[1,2,3,4,5,6].map(i=>TX(i)-3))];
const POP=DX.map(([i],j)=>{const k=DX.slice(0,j).filter(d=>d[0]===i).length;return ARR[i]+0.12+k*0.15;});
const QUIT=M.crossTimes(hx,GRAB,DROP,[-200])[0];
M.scene({
  W:1664,H:240,bg:null,T:9.4,center:[832,120],intro:0.15,
  SH:{pill:{w:260,h:72,r:36,bg:'#1B252F',cam:1}}, start:'pill', SEQ:[],
  layers:[{el:'Lc',tin:0.15,tout:null,o:{din:0.05}}],
  cursor:{size:30,drags:[[GRAB,DROP]],keys:KX},
  geom:(t,g)=>{g.cx=M.clamp(hx(t),-702,702); g.cy=-72; return g;},
  extra:(t,g)=>{
    const x=hx(t);
    $('fill').style.width=(x+728)+'px';
    const held=M.clamp((t-GRAB)/0.15)*(t<DROP?1:Math.max(0,1-(t-DROP)/0.2));
    Object.assign($('head').style,{left:x+'px',transform:`scale(${(1+0.15*held).toFixed(4)})`});
    Object.assign($('ptr').style,{left:M.clamp(x,g.cx-100,g.cx+100)+'px',opacity:g.op.toFixed(3),transform:`rotate(45deg) scale(${g.sc.toFixed(4)})`});
    let now=-1; for(let i=0;i<7;i++) if(x>=TX(i)-3) now=i;
    for(let i=0;i<7;i++){const done=i<=now;
      Object.assign($('k'+i).style,{background:done?'#1B252F':'transparent',border:done?'none':'2px solid rgba(27,37,47,.3)'});
      $('d'+i).style.color=i===now?'#1B252F':done?'#6E7A88':'#95A0AE';}
    let n=0, last=-9;
    POP.forEach((p,j)=>{const on=t>=p; if(on){n++; last=Math.max(last,p);}
      $('p'+j).style.transform=`scale(${on?M.S(t-p,28,0.5).toFixed(4):0})`;});
    M.setText($('cnt'),String(n));
    $('cnt').style.transform=`scale(${(1+0.18*Math.max(0,1-(t-last)/0.25)).toFixed(4)})`;
    M.apply($('qbar'),M.vis(t,QUIT,null));
    M.apply($('qlab'),M.vis(t,QUIT+0.1,null));
  },
});
</script>
