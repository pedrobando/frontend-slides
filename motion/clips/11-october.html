<title>11 October timeline</title>
<style>
.ev .k{position:absolute;left:-256px;top:18px;font-size:13px}
.ev .tt{position:absolute;left:-256px;top:38px;font-size:21px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.ev .ds{position:absolute;left:-256px;top:72px;width:512px;font-size:15px;color:#6E7A88;white-space:nowrap}
.dt{position:absolute;top:72px;width:120px;margin-left:-60px;text-align:center;font-family:'Geist Mono',monospace;font-size:13px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase}
.tk{position:absolute;top:53px;width:10px;height:10px;margin-left:-5px;border-radius:50%;box-sizing:border-box}
</style>
<div data-slot="world">
  <div class="a" style="left:-780px;top:57px;width:1560px;height:3px;border-radius:2px;background:rgba(251,251,251,.2)"></div>
  <div class="a" id="fill" style="left:-780px;top:57px;height:3px;border-radius:2px;background:rgba(251,251,251,.7)"></div>
  <div id="ticks"></div>
  <div class="a" id="stem" style="width:2px;margin-left:-1px;background:rgba(251,251,251,.55)"></div>
  <div class="a" id="head" style="top:47px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#FBFBFB;box-sizing:border-box"></div>
</div><!--/world-->
<div data-slot="shape">
  <div class="L" id="Lbar"><div class="a" id="bar" style="left:0;top:0;height:5px"></div></div>
  <div id="evs"></div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
const EV=[['Sep 30','Reffkin’s ultimatum','Stop fining agents over office exclusives by Oct 6, or get sued.','#E0A63A'],
 ['Oct 5','CRMLS sues first','The big California MLS asks a court to declare its rules legal.','#C05445'],
 ['Oct 16','Compass sues back','Offers to pay its agents’ fines if they sign over their right to sue.','#C05445'],
 ['Oct 20','OneKey says no','New York’s MLS rejects the demand.','#C05445'],
 ['Oct 21','Six more MLSs sue','Arizona, Colorado, North Carolina and the Bay Area.','#C05445'],
 ['Oct 26','Open Real Estate','KW, eXp, HomeServices and Real / RE/MAX answer.','#5E9E2A']];
const TX=i=>-780+i*312;
$('ticks').innerHTML=EV.map((e,i)=>`<div class="tk" id="k${i}" style="left:${TX(i)}px"></div><div class="dt" id="d${i}" style="left:${TX(i)}px">${e[0]}</div>`).join('');
$('evs').innerHTML=EV.map((e,i)=>`<div class="L ev" id="e${i}"><div class="k" style="color:${e[3]}">${e[0]}, 2026</div><div class="tt disp">${e[1]}</div><div class="ds">${e[2]}</div></div>`).join('');
// the date pill is dragged tick to tick, pausing on each event
const GRAB=1.45, DROP=9.15;
const KX=[[0,-640,20],[1.0,-640,20],[1.4,-780,58],[1.9,-780,58],[2.6,-468,58],[3.6,-468,58],[4.3,-156,58],[5.3,-156,58],[5.9,156,58],[6.7,156,58],[7.2,468,58],[8.2,468,58],[8.9,780,58],[9.4,780,58],[10.0,640,36]];
const cur=M.path(KX);
const hx=t=>t<GRAB?-780:t<DROP?cur(t).x:780;
const SW=M.crossTimes(hx,0,10,[0,1,2,3,4].map(k=>TX(k)+156));   // when the head passes halfway to the next event
const TIN=[0.15,...SW], TOUT=[...SW,null];
const barC=M.ctrack(EV[0][3],SW.map((s,k)=>[s,EV[k+1][3]]));
const cx=M.track(-564,[[0.01,-564]]);
M.scene({
  W:1700,H:200,bg:null,T:10.4,center:[850,100],intro:0.15,
  SH:{ev:{w:560,h:112,r:18,bg:'#FBFBFB',cam:1.0}, last:{w:560,h:112,r:18,bg:'#EEF6E4',cam:1.0}},
  start:'ev', SEQ:[[SW[4],'last']],
  layers:[
    {el:'Lbar',tin:0.15,tout:null,anchor:'t',o:{din:0},update:(t,g)=>{Object.assign($('bar').style,{left:(-g.w/2)+'px',width:g.w+'px',background:barC(t)});}},
    ...EV.map((e,i)=>({el:'e'+i,tin:TIN[i],tout:TOUT[i],anchor:'t',o:{din:0.06,lin:0.2,lout:0.1}})),
  ],
  cursor:{size:26,drags:[[GRAB,DROP]],keys:KX},
  geom:(t,g)=>{g.cx=M.clamp(hx(t),-564,564); g.cy=-40; return g;},
  extra:(t,g)=>{
    const x=hx(t), n=TIN.filter(s=>t>=s).length-1;
    $('fill').style.width=(x+780)+'px';
    Object.assign($('head').style,{left:x+'px',border:`5px solid ${barC(t)}`,transform:`scale(${1+0.15*M.clamp((t-GRAB)/0.15)*(t<DROP?1:Math.max(0,1-(t-DROP)/0.2))})`});
    Object.assign($('stem').style,{left:x+'px',top:(g.cy+g.h/2)+'px',height:Math.max(0,47-(g.cy+g.h/2))+'px'});
    for(let i=0;i<6;i++){const done=x>=TX(i)-2, cu=i===n; $('k'+i).style.background=done?'#FBFBFB':'transparent'; $('k'+i).style.border=done?'none':'2px solid rgba(251,251,251,.35)';
      $('d'+i).style.color=cu?'#FBFBFB':done?'#95A0AE':'#5C6876';}
  },
});
</script>
