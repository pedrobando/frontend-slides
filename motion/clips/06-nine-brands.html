<title>06 One company, nine brands</title>
<style>
.cell{position:absolute;width:218px;height:56px;border-radius:12px;background:#F1EFEA;box-sizing:border-box;padding:9px 14px 0}
.cell b{display:block;font-size:16px;font-weight:600;white-space:nowrap;line-height:20px}
.cell small{display:block;margin-top:3px;font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:#6E7A88}
.cell.par{background:#E6F3D7}.cell.par small{color:#2C5E15}
.ph{position:absolute;width:218px;height:56px;border-radius:12px;border:2px dashed #C9C5BE;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#6E7A88}
</style>
<div data-slot="shape">
  <div class="L" id="Lpill">
    <div class="a disp" style="left:-138px;top:-19px;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:38px">Compass</div>
    <div class="a" id="btn" style="left:4px;top:-20px;width:136px;height:40px;border-radius:20px;background:#8CC94E;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600"><span id="icPlus"></span>Anywhere</div>
  </div>
  <div class="L" id="Lcard">
    <div class="a disp" id="ttl" style="left:-336px;top:15px;font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap"></div>
    <div class="row" style="right:-336px;top:17px;gap:8px;font-size:17px;font-weight:600;color:#2C5E15"><i style="width:9px;height:9px;border-radius:50%;background:#8CC94E"></i><span id="cnt"></span></div>
    <div id="grid"></div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
$('icPlus').innerHTML=M.icon('plus',15,'#1B252F',2.4);
const B=[['Compass','The buyer','par'],['Coldwell Banker','via Anywhere'],['Century 21','via Anywhere'],["Sotheby's Int'l Realty",'via Anywhere'],['Corcoran','via Anywhere'],['ERA','via Anywhere'],['BHG Real Estate','via Anywhere'],['@properties','bought Jan 2025'],["Christie's Int'l RE",'bought Jan 2025']];
const X=c=>-336+c*226, Y=r=>52+r*64;
// cell i appears at BT[i]: Compass with the card, the six Anywhere brands one per name, the two Jan 2025 buys on the click
const CLICK1=2.2, CLICK2=7.5, FINAL=9.0;
const BT=[2.35,2.9,3.35,3.8,4.25,4.7,5.15,7.62,7.84];
$('grid').innerHTML=B.map((b,i)=>`<div class="cell ${b[2]||''}" id="c${i}" style="left:${X(i%3)}px;top:${Y(Math.floor(i/3))}px"><b>${b[0]}</b><small>${b[1]}</small></div>`).join('')
  +`<div class="ph" id="ph0" style="left:${X(1)}px;top:${Y(2)}px"><span id="icPlus2"></span>&nbsp;Jan 2025 buys</div><div class="ph" id="ph1" style="left:${X(2)}px;top:${Y(2)}px"></div>`;
$('icPlus2').innerHTML=M.icon('plus',14,'#6E7A88',2.4);
const btnP=M.track(0,[[CLICK1-0.07,1,[45,1]],[CLICK1+0.035,0,[22,.72]]]);
M.scene({
  W:740,H:270,bg:null,T:10,center:[370,135],intro:0.15,
  SH:{pill:{w:320,h:76,r:38,bg:'#FBFBFB',cam:1.15}, card:{w:700,h:252,r:22,bg:'#FBFBFB',cam:1.0}},
  start:'pill', SEQ:[[CLICK1,'card']], camSpring:[11,1],
  layers:[
    {el:'Lpill',tin:0.15,tout:CLICK1,o:{din:0.05},update:(t)=>{$('btn').style.transform=`scale(${1-0.06*btnP(t)})`;}},
    {el:'Lcard',tin:CLICK1,tout:null,anchor:'t',update:(t)=>{
      for(let i=0;i<9;i++){const v=M.vis(t,BT[i],null,{din:0,lin:0.22}),c=$('c'+i); if(M.apply(c,v,` translateY(${((1-v.a)*10).toFixed(2)}px)`)) c.style.transformOrigin='50% 50%';}
      for(let j=0;j<2;j++){const v=M.vis(t,BT[6]+0.35+0.1*j,CLICK2+0.04*j,{din:0,lin:0.3,lout:0.14}); M.apply($('ph'+j),v);}
      const n=BT.filter(x=>t>=x).length; M.setText($('cnt'),n+(n===1?' brand':' brands'));
      M.setText($('ttl'),t<FINAL?'Compass + Anywhere':'One company');
      const k=M.vis(t,FINAL-0.12,null,{din:0,lin:0.2}); const tv=t<FINAL-0.12?1:(t<FINAL?1-M.eo((t-FINAL+0.12)/0.12):k.a);
      $('ttl').style.opacity=tv.toFixed(3); $('ttl').style.filter=tv<0.99?`blur(${((1-tv)*6).toFixed(2)}px)`:'none'; $('ttl').style.color=t<FINAL?'#1B252F':'#2C5E15';
    }},
  ],
  cursor:{size:26,clicks:[CLICK1,CLICK2],keys:[[0,215,64],[1.15,215,64],[1.95,72,4],[2.45,72,4],[3.1,150,-98],[6.6,150,-98],[7.25,0,84],[7.7,0,84],[8.6,150,-98]]},
});
</script>
